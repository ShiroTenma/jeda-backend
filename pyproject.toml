[project]
name = "jeda-backend"
version = "0.1.0"
description = "JEDA local companion backend prototype"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "numpy>=2.4.6",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
